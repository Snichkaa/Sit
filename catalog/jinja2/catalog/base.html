<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}VG Project{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url('index') }}">VG Project</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <div class="navbar-nav">
            <a class="nav-link" href="{{ url('publishers') }}">Publishers</a>
            <a class="nav-link" href="{{ url('platforms') }}">Platforms</a>
            <a class="nav-link" href="{{ url('genres') }}">Genres</a>
            <a class="nav-link" href="{{ url('games') }}">Games</a>
            <a class="nav-link" href="{{ url('sales') }}">Sales</a>
            <span class="navbar-text mx-2 text-white-50">|</span>
            <a class="nav-link" href="{{ url('game_add') }}">+ Add Game (Form)</a>
            <a class="nav-link" href="/admin/">Admin</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
