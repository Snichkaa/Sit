{% extends "catalog/base.html" %}
{% block content %}
<h2>Publishers</h2>
<table border="1" cellpadding="6" cellspacing="0">
  <thead><tr><th>ID</th><th>Name</th></tr></thead>
  <tbody>
    {% for r in rows %}
      <tr><td>{{ r.id }}</td><td>{{ r.name }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
